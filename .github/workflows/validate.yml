name: Validate ANCF WordPress

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate JSON contracts
        run: python3 tools/validate_contracts.py
      - name: Validate Rank Smart safety invariant
        run: python3 tools/validate_rank_smart_safety.py
      - name: Lint PHP
        run: find plugins theme -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build installable ZIPs
        run: python3 tools/package_release.py
